[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# ---------- Security headers (ทุกหน้า) ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ---------- Cache ----------
# ไฟล์ของ Next ใส่ hash ในชื่อไฟล์ จึง cache ยาวได้
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# รูปไม่มี hash ในชื่อ — cache 7 วัน
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ---------- รวมโดเมน (T26) ----------
# Search Console พบหน้าแรกถูก index 3 เวอร์ชัน (https, https://www, http)
# บังคับทุกเวอร์ชันไปที่ https://southsteel-th.com แบบ 301
[[redirects]]
  from = "https://www.southsteel-th.com/*"
  to = "https://southsteel-th.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.southsteel-th.com/*"
  to = "https://southsteel-th.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://southsteel-th.com/*"
  to = "https://southsteel-th.com/:splat"
  status = 301
  force = true
